[package]
name = "foundation4d"
version = "0.1.0"
edition = "2024"
description = "Foundation4D (arXiv 2610.30340) — unified perception & reconstruction for autonomous vehicles, implemented in Rust. Scaled-down, dependency-free inference stack."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native_demo"
path = "src/bin/native_demo.rs"

[features]
splat_dbg = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
